name: VulnFlow Autonomous Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: VulnFlow execution mode
        type: choice
        required: true
        default: pr
        options: [pr, report, dry-run]
      no_llm:
        description: Use the deterministic planner
        type: boolean
        default: true
      vulnflow_ref:
        description: VulnFlow branch, tag, SHA, or supported GHCR image reference. Blank or latest uses the default branch.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  vulnflow-remediation:
    runs-on: ubuntu-latest
    env:
      VULNFLOW_MODE: ${{ inputs.mode || 'report' }}
      VULNFLOW_BUILD_SANDBOX_IMAGE: ${{ vars.VULNFLOW_BUILD_SANDBOX_IMAGE || 'vulnflow-npm-sandbox:ci' }}
      VULNFLOW_REPORTS_DIR: ${{ github.workspace }}/.vulnflow/reports
      VULNFLOW_AUDIT_DIR: ${{ github.workspace }}/.vulnflow/audit
    steps:
      - name: Check out the test repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare the VulnFlow CLI
        uses: ./.github/actions/setup-vulnflow
        with:
          source-ref: ${{ inputs.vulnflow_ref }}
          source-token: ${{ secrets.VULNFLOW_SOURCE_TOKEN || github.token }}
          prepare-sandbox: ${{ env.VULNFLOW_MODE != 'report' }}
          npm-cache-specs: ${{ vars.VULNFLOW_NPM_CACHE_SPECS }}

      - name: Run the scan on the runner
        shell: bash
        env:
          NO_LLM: ${{ github.event_name != 'workflow_dispatch' || inputs.no_llm }}
          GITHUB_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          VULNFLOW_LLM_PROVIDER: ${{ vars.VULNFLOW_LLM_PROVIDER || 'nvidia' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VULNFLOW_REPOSITORY: ${{ github.repository }}
          VULNFLOW_ORG_SLUG: ${{ secrets.VULNFLOW_ORG_SLUG || github.repository_owner }}
        run: |
          mkdir -p "$VULNFLOW_REPORTS_DIR" "$VULNFLOW_AUDIT_DIR"
          flags=()
          if [[ "$NO_LLM" == "true" ]]; then flags+=(--no-llm); fi
          if [[ "$VULNFLOW_MODE" != "report" ]]; then
            if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SECRET_KEY" ]]; then
              echo "::error::Remediation testing requires Supabase so a separate approval job can resume the run."
              exit 1
            fi
            export VULNFLOW_SUPABASE_REQUIRED=true
          fi
          result=0
          vulnflow scan --repo "$GITHUB_WORKSPACE" --scanner trivy \
            --mode "$VULNFLOW_MODE" --output "$VULNFLOW_REPORTS_DIR/report.md" "${flags[@]}" || result=$?
          case "$result" in
            0) echo "VulnFlow completed." ;;
            10) echo "::notice::Approval required. Use the plan ID from the report in VulnFlow Approval Workflow." ;;
            20) echo "::warning::VulnFlow blocked remediation. See the report." ;;
            30) echo "::error::Verification failed. See the report."; exit "$result" ;;
            *) exit "$result" ;;
          esac

      - name: Publish the scan summary
        if: always()
        shell: bash
        run: |
          if [[ -s "$VULNFLOW_REPORTS_DIR/report.md" ]]; then
            cat "$VULNFLOW_REPORTS_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports and audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnflow-artifacts
          path: |
            .vulnflow/reports/
            .vulnflow/audit/
          retention-days: 14
