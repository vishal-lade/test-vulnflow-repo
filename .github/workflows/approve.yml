name: VulnFlow Approval Workflow

on:
  workflow_dispatch:
    inputs:
      plan_id:
        description: Plan ID from the scan report (or comma-separated IDs)
        required: true
        type: string
      action:
        description: Governance decision
        required: true
        default: approve
        type: choice
        options: [approve, reject]
      reason:
        description: Reviewer rationale
        default: Approved by security reviewer
        type: string
      resume:
        description: Resume remediation after approval
        default: true
        type: boolean
      vulnflow_ref:
        description: VulnFlow branch, tag, SHA, or supported GHCR image reference. Blank or latest uses the default branch.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  approve-and-resume:
    runs-on: ubuntu-latest
    env:
      VULNFLOW_BUILD_SANDBOX_IMAGE: ${{ vars.VULNFLOW_BUILD_SANDBOX_IMAGE || 'vulnflow-npm-sandbox:ci' }}
      VULNFLOW_REPORTS_DIR: ${{ github.workspace }}/.vulnflow/reports
      VULNFLOW_AUDIT_DIR: ${{ github.workspace }}/.vulnflow/audit
    steps:
      - name: Check out the test repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare the VulnFlow CLI
        uses: ./.github/actions/setup-vulnflow
        with:
          source-ref: ${{ inputs.vulnflow_ref }}
          source-token: ${{ secrets.VULNFLOW_SOURCE_TOKEN || github.token }}
          prepare-sandbox: ${{ inputs.action == 'approve' && inputs.resume }}
          npm-cache-specs: ${{ vars.VULNFLOW_NPM_CACHE_SPECS }}

      - name: Record the decision and resume on the runner
        shell: bash
        env:
          PLAN_ID: ${{ inputs.plan_id }}
          DECISION: ${{ inputs.action }}
          RESUME: ${{ inputs.resume }}
          REASON: ${{ inputs.reason }}
          REVIEWER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          VULNFLOW_LLM_PROVIDER: ${{ vars.VULNFLOW_LLM_PROVIDER || 'nvidia' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VULNFLOW_SUPABASE_REQUIRED: 'true'
          VULNFLOW_REPOSITORY: ${{ github.repository }}
          VULNFLOW_ORG_SLUG: ${{ secrets.VULNFLOW_ORG_SLUG || github.repository_owner }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SECRET_KEY" ]]; then
            echo "::error::Supabase credentials are required to load the paused run."
            exit 1
          fi
          flags=()
          if [[ "$DECISION" == "reject" ]]; then
            flags+=(--reject)
          elif [[ "$RESUME" == "true" ]]; then
            flags+=(--resume)
          fi
          vulnflow approve --plan-id "$PLAN_ID" --repo "$GITHUB_WORKSPACE" \
            --reviewer "$REVIEWER" --reason "$REASON" "${flags[@]}"

      - name: Upload resume reports and audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnflow-approval-artifacts
          if-no-files-found: ignore
          path: |
            .vulnflow/reports/
            .vulnflow/audit/
          retention-days: 14
